name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Lint · Typecheck · Test · Build · Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (version from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # --ignore-scripts：与本地 npm 12 默认拦截依赖安装脚本的行为一致（已验证构建/测试/运行都成立），
      # 也让安装步骤不执行第三方生命周期脚本；新增依赖若确实需要 postinstall，会在这里响亮失败而不是静默出错。
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          ENCRYPTION_KEY: "ci-only-build-placeholder-key-not-used-at-runtime"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Check docs links
        run: python scripts/check-links.py . --fragments --refs

      - name: Check git diff cleanliness
        run: git diff --check

  # 浏览器面回归守卫：offline E2E 全程 mock API（页面路由）、主动 abort WebR CDN，
  # 因此不需要数据库、密钥或外网；覆盖 Monaco、结果区、R 面板、统一历史时间线、分割句柄、移动端。
  e2e:
    name: Offline E2E (browser)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 25
    env:
      ENCRYPTION_KEY: "ci-only-build-placeholder-key-not-used-at-runtime"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node (version from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run offline E2E against the production build
        run: |
          mkdir -p .artifacts
          npx next start -p 4321 > .artifacts/next-start.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:4321 > /dev/null && break
            sleep 2
          done
          if ! curl -sf http://localhost:4321 > /dev/null; then
            echo "next start did not become ready"
            cat .artifacts/next-start.log
            exit 1
          fi
          python scripts/offline_workspace_e2e.py

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-e2e-artifacts
          path: |
            .artifacts/offline-e2e
            .artifacts/next-start.log
          if-no-files-found: ignore

  # 收口 job —— ruleset 的 required_status_checks 只配这一个名字（CI Success），
  # 本仓内部 job 增删时规则集无需改动。改本 job 前必读三条：
  #   1. 判定只放 step 级：放 job 级时条件为假会让本 job 变 skipped，
  #      而 GitHub 把 skipped 当 Success —— 那正好是我们要防的假绿。
  #   2. needs 必须列全本文件所有 job id；漏一个，那个 job 红了也照样放行
  #      （本仓 e2e 依赖 verify，只列 e2e 的话 verify 失败时 e2e 变 skipped、门禁放行）。
  #   3. skipped 一并判红：本 workflow 没有合法的 if: 跳过，出现 skipped
  #      只可能是上游失败级联（上游同在 needs 里，会同时判红）。
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::有 job 未成功 —— CI Success 判红（原因见本 job 上方注释）"
          echo '${{ toJSON(needs) }}'
          exit 1
